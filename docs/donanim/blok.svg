<text x="900" y="262" font-size="9" fill="#111" text-anchor="start">13,56 MHz</text>
<text x="20" y="430" font-size="12" fill="#111" text-anchor="start">5 V rayı: DevKit (5V pini), MAX98357A VIN, 74AHCT1G125 VCC, halka.  3V3 rayı (DevKit LDO): RC522, INMP441.</text>
<text x="20" y="452" font-size="12" fill="#111" text-anchor="start">Akım bütçesi (en kötü an): halka 0,6 A (yazılım sınırı) + hoparlör 0,7 A + ESP32 0,35 A + RC522 0,1 A ≈ 1,75 A &lt; 2 A.</text>
<text x="20" y="474" font-size="12" fill="#111" text-anchor="start">Mikrofon arkada üstte, hoparlör önde altta (≈125 mm); ses ve halka kabloları mikrofon kablosundan ayrı yoldan.</text>
